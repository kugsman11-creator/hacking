<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PLAYBOX 100</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
margin:0;
background:#08090d;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
button{cursor:pointer;color:#fff;border:0}
.app{max-width:900px;margin:auto;padding:16px 14px 80px}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px
}
.logo{display:flex;gap:10px;align-items:center}
.logoIcon{
width:43px;height:43px;border-radius:14px;
display:grid;place-items:center;
background:linear-gradient(135deg,#8b7cff,#5144d8);
font-size:21px
}
.logo h1{margin:0;font-size:20px}
.logo small{color:#8d93a6;font-size:10px}

.stats{display:flex;gap:5px}
.stat{
background:#11131a;
border:1px solid #252936;
border-radius:11px;
padding:6px 8px;
text-align:center
}
.stat b{display:block;font-size:12px}
.stat span{font-size:8px;color:#8d93a6}

.hero{
padding:22px;
border-radius:23px;
background:linear-gradient(135deg,#211d45,#11131a);
border:1px solid #302b52;
}
.hero h2{margin:0;font-size:28px}
.hero p{
color:#969caf;
font-size:12px;
line-height:1.6;
margin:7px 0 0
}
.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:17px
}
.primary,.secondary{
padding:10px 13px;
border-radius:11px;
font-size:11px;
font-weight:700
}
.primary{background:#7668ed}
.secondary{
background:#181a23;
border:1px solid #292d39
}

.daily{
margin-top:12px;
padding:13px;
border:1px solid #29254a;
border-radius:16px;
background:#11131a;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}
.daily b{font-size:12px}
.daily p{margin:3px 0 0;color:#858b9c;font-size:9px}

.nav{
display:flex;
gap:6px;
overflow-x:auto;
padding:15px 0 8px
}
.nav button{
white-space:nowrap;
padding:9px 12px;
border-radius:10px;
background:#11131a;
border:1px solid #252936;
font-size:10px;
color:#8e94a6
}
.nav button.active{
background:#29234f;
color:white;
border-color:#665cc0
}

.tools{display:flex;gap:7px;margin:7px 0 15px}
.search{position:relative;flex:1}
.search input{
width:100%;
padding:12px 12px 12px 35px;
border-radius:12px;
background:#11131a;
border:1px solid #252936;
outline:0;
color:#fff;
font-size:11px
}
.search span{
position:absolute;
left:12px;
top:9px;
opacity:.6
}
.tool{
width:43px;
border-radius:12px;
background:#11131a;
border:1px solid #252936
}

.section{
display:flex;
justify-content:space-between;
align-items:center;
margin:15px 2px 9px
}
.section h3{margin:0;font-size:14px}
.section span{font-size:9px;color:#7e8495}

.games{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px
}

.card{
background:#11131a;
border:1px solid #252936;
border-radius:16px;
padding:12px;
min-height:142px;
transition:.15s
}
.card:active{transform:scale(.97)}
.cardTop{
display:flex;
justify-content:space-between
}
.icon{
width:39px;height:39px;
border-radius:12px;
background:#1c1f2a;
display:grid;
place-items:center;
font-size:20px
}
.fav{
background:#1a1c24;
border-radius:8px;
width:27px;height:27px;
color:#676d7d
}
.fav.on{color:#ff6684}
.card h4{margin:9px 0 3px;font-size:12px}
.card p{
margin:0;
font-size:9px;
color:#858b9c;
line-height:1.4
}
.cardBottom{
display:flex;
justify-content:space-between;
margin-top:10px;
font-size:8px
}
.cat{color:#9c91ff}
.high{color:#facc15}

/* GAME */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
backdrop-filter:blur(8px);
display:none;
align-items:center;
justify-content:center;
padding:10px;
z-index:100
}
.overlay.show{display:flex}

.window{
width:min(650px,100%);
max-height:94vh;
overflow:auto;
background:#0d0f15;
border:1px solid #292d38;
border-radius:23px
}

.gameHead{
position:sticky;
top:0;
z-index:5;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:#0d0f15;
border-bottom:1px solid #252936
}
.gameHead b{font-size:13px}
.gameHead small{
display:block;
font-size:8px;
color:#777d8e;
margin-top:2px
}
.close{
width:35px;
height:35px;
border-radius:10px;
background:#1b1e27
}

.content{padding:16px}
.intro{text-align:center;margin-bottom:14px}
.bigIcon{font-size:38px}
.intro h2{margin:5px 0;font-size:20px}
.intro p{margin:0;color:#858b9c;font-size:10px}

.area{
background:#11141c;
border:1px solid #252936;
border-radius:17px;
padding:14px;
min-height:230px
}

.gstats{
display:flex;
gap:6px;
margin-bottom:12px
}
.gs{
flex:1;
text-align:center;
background:#191c24;
border-radius:10px;
padding:7px
}
.gs b{display:block;font-size:13px}
.gs span{font-size:8px;color:#7e8495}

.center{text-align:center}
.big{
font-size:57px;
font-weight:900;
margin:20px 0;
letter-spacing:-4px
}

.answers{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px
}
.answer{
min-height:52px;
border-radius:12px;
background:#191c24;
border:1px solid #292d39;
font-size:11px;
font-weight:700
}
.answer.correct{
background:#12321f;
border-color:#4ade80
}
.answer.wrong{
background:#381923;
border-color:#fb7185
}

.row{
display:flex;
gap:7px;
margin-top:12px
}
.row button{flex:1}

.startBtn{
width:100%;
padding:12px;
border-radius:12px;
background:#7668ed;
font-weight:700;
font-size:11px
}

.msg{
text-align:center;
font-size:11px;
margin-top:10px;
min-height:18px
}

/* target */
.targetArea{
height:280px;
position:relative;
overflow:hidden;
border-radius:14px;
background:
linear-gradient(#ffffff08 1px,transparent 1px),
linear-gradient(90deg,#ffffff08 1px,transparent 1px),
#0a0c11;
background-size:25px 25px
}
.target{
position:absolute;
width:45px;height:45px;
border-radius:50%;
background:linear-gradient(135deg,#b3aaff,#6456e8);
box-shadow:0 0 25px #7668ed88
}

/* memory */
.memory{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px
}
.mem{
aspect-ratio:1;
border-radius:10px;
background:#191c24;
border:1px solid #292d39;
display:grid;
place-items:center;
font-size:21px
}

/* tap */
.tapButton{
width:150px;
height:150px;
border-radius:50%;
background:linear-gradient(135deg,#8d7fff,#5546dc);
font-size:18px;
font-weight:900;
box-shadow:0 0 40px #7668ed55
}

/* result */
.result{text-align:center;padding:25px 10px}
.result .emoji{font-size:45px}
.result h2{margin:7px 0}
.result p{font-size:11px;color:#8b91a2}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">
<div class="logoIcon">🎮</div>
<div>
<h1>PLAYBOX 100</h1>
<small>100 tiny games. One place.</small>
</div>
</div>

<div class="stats">
<div class="stat"><b id="coins">0</b><span>COINS</span></div>
<div class="stat"><b id="stars">0</b><span>STARS</span></div>
</div>
</header>

<section class="hero">
<h2>Play something. 💜</h2>
<p>
A mini arcade made for two. Pick a game, beat your score,
collect coins and discover all 100 games.
</p>

<div class="actions">
<button class="primary" onclick="randomGame()">🎲 Random Game</button>
<button class="secondary" onclick="showFavorites()">❤️ Favorites</button>
<button class="secondary" onclick="showRecent()">🕘 Recent</button>
</div>
</section>

<div class="daily">
<div>
<b>🌟 Daily Challenge</b>
<p id="dailyText">Today's challenge is waiting for you.</p>
</div>
<button class="primary" onclick="dailyGame()">PLAY</button>
</div>

<div class="nav" id="nav">
<button class="active" onclick="filterGames('All',this)">All</button>
<button onclick="filterGames('Brain',this)">🧠 Brain</button>
<button onclick="filterGames('Reflex',this)">⚡ Reflex</button>
<button onclick="filterGames('Arcade',this)">🎯 Arcade</button>
<button onclick="filterGames('Couple',this)">💜 Couple</button>
<button onclick="filterGames('Creative',this)">🎨 Creative</button>
</div>

<div class="tools">
<div class="search">
<span>🔎</span>
<input id="search" placeholder="Search games..." oninput="renderGames()">
</div>
<button class="tool" onclick="randomGame()">🎲</button>
<button class="tool" onclick="settings()">⚙️</button>
</div>

<div class="section">
<h3>All Games</h3>
<span id="count">100 games</span>
</div>

<div class="games" id="games"></div>

</div>


<!-- GAME WINDOW -->

<div class="overlay" id="overlay">
<div class="window">

<div class="gameHead">
<div>
<b id="gameTitle">Game</b>
<small id="gameCategory">Category</small>
</div>
<button class="close" onclick="closeGame()">✕</button>
</div>

<div class="content">

<div class="intro">
<div class="bigIcon" id="gameIcon">🎮</div>
<h2 id="introTitle">Game</h2>
<p id="gameDesc">Description</p>
</div>

<div class="area" id="gameArea"></div>

</div>
</div>
</div>


<script>

/* =========================
   DATA
========================= */

const games=[
["Memory Match","🧠","Brain","Find the matching pairs.","memory"],
["Number Guess","🔢","Brain","Guess the hidden number.","number"],
["Higher or Lower","📈","Brain","Guess what comes next.","higher"],
["Odd One Out","👀","Brain","Find the different emoji.","odd"],
["Quick Math","➗","Brain","Solve before time runs out.","math"],
["Color Logic","🎨","Brain","Choose the correct color.","color"],
["Pattern Memory","🧩","Brain","Remember the pattern.","memory"],
["Sequence","🔢","Brain","Find the next number.","sequence"],
["Missing Number","❓","Brain","Complete the sequence.","sequence"],
["Word Scramble","🔤","Brain","Unscramble the word.","word"],
["Anagram","📝","Brain","Make the word.","word"],
["Emoji Guess","😂","Brain","Guess the meaning.","emoji"],
["Riddle Rush","💡","Brain","Solve the riddle.","riddle"],
["True or False","✅","Brain","Test your knowledge.","tf"],
["Trivia","📚","Brain","Answer the question.","trivia"],
["Reaction Quiz","⚡","Brain","Think fast.","reaction"],
["Spot Difference","🔍","Brain","Spot what changed.","odd"],
["Logic Grid","🧠","Brain","Choose logically.","logic"],
["Code Breaker","🔐","Brain","Crack the code.","code"],
["Mini Sudoku","🔢","Brain","Complete the puzzle.","sudoku"],

["Tap The Target","🎯","Reflex","Hit the target quickly.","target"],
["Reaction Test","⚡","Reflex","Test your reaction speed.","reaction"],
["Don't Tap Red","🔴","Reflex","Tap only safe targets.","tap"],
["Falling Objects","⬇️","Reflex","Catch falling objects.","target"],
["Catch The Coin","🪙","Reflex","Catch as many as possible.","tap"],
["Dodge","💨","Reflex","Survive the timer.","target"],
["Speed Tap","👆","Reflex","Tap as fast as possible.","tap"],
["Timing Bar","⏱️","Reflex","Stop at the perfect point.","timing"],
["Moving Target","🎯","Reflex","Hit moving targets.","target"],
["Quick Click","🖱️","Reflex","Click quickly.","tap"],
["Avoid The Walls","🧱","Reflex","Don't touch the walls.","target"],
["Color Tap","🌈","Reflex","Tap the right color.","color"],
["Hit The Circle","⭕","Reflex","Hit it before it moves.","target"],
["Laser Dodge","🔴","Reflex","Avoid the laser.","target"],
["Falling Blocks","🟪","Reflex","React quickly.","tap"],
["Reflex Memory","🧠","Reflex","Remember the flash.","memory"],
["One Second","⏱️","Reflex","Stop near one second.","timing"],
["Fast Finger","☝️","Reflex","Tap rapidly.","tap"],
["Perfect Timing","🎯","Reflex","Find the perfect moment.","timing"],
["Impossible Button","😈","Reflex","Try to beat it.","tap"],

["Snake","🐍","Arcade","Classic snake.","snake"],
["Breakout","🧱","Arcade","Break the blocks.","breakout"],
["Flappy Bird","🐦","Arcade","Fly through gaps.","tap"],
["Mini Runner","🏃","Arcade","Run as long as possible.","tap"],
["Space Shooter","🚀","Arcade","Defend space.","tap"],
["Asteroid Dodge","☄️","Arcade","Avoid asteroids.","target"],
["Coin Collector","🪙","Arcade","Collect coins.","tap"],
["Maze Escape","🌀","Arcade","Escape the maze.","maze"],
["Platform Jump","🦘","Arcade","Jump higher.","tap"],
["Tower Stack","🏗️","Arcade","Stack perfectly.","timing"],
["Ball Bounce","⚽","Arcade","Keep the ball alive.","tap"],
["Brick Breaker","🧱","Arcade","Break bricks.","breakout"],
["Mini Golf","⛳","Arcade","Reach the hole.","timing"],
["Pinball","🎰","Arcade","Keep bouncing.","tap"],
["Endless Road","🛣️","Arcade","Stay on the road.","target"],
["Car Dodge","🚗","Arcade","Avoid traffic.","target"],
["Rocket Launch","🚀","Arcade","Launch as high as possible.","tap"],
["Balloon Pop","🎈","Arcade","Pop balloons.","tap"],
["Target Shooter","🔫","Arcade","Hit targets.","target"],
["Survival Arena","⚔️","Arcade","Survive the timer.","target"],

["Who Knows Who?","💜","Couple","See how well you know each other.","couple"],
["This Or That","💭","Couple","Pick your choice.","choice"],
["Guess My Answer","💜","Couple","Guess what they would choose.","choice"],
["Favorite Things","⭐","Couple","Pick your favorite.","choice"],
["Memory Of Us","📸","Couple","Test your memories.","choice"],
["Finish My Sentence","💬","Couple","Complete the sentence.","choice"],
["Emoji Story","🥰","Couple","Create a story.","choice"],
["Pick One","👉","Couple","Choose one.","choice"],
["Random Question","❓","Couple","Answer honestly.","choice"],
["Would You Rather","🤔","Couple","Choose between two.","choice"],
["Guess The Song","🎵","Couple","Guess the song.","choice"],
["Guess The Movie","🎬","Couple","Guess the movie.","choice"],
["Couple Trivia","💞","Couple","Relationship trivia.","choice"],
["Secret Question","🔐","Couple","A random question.","choice"],
["Truth Or Dare","😈","Couple","Choose truth or dare.","choice"],
["Mood Picker","😊","Couple","Pick your mood.","choice"],
["Compliment Generator","💌","Couple","Get a cute message.","choice"],
["Date Idea Picker","🌹","Couple","Choose your next date.","choice"],
["Future Guess","🔮","Couple","Imagine the future.","choice"],
["Compatibility Quiz","💞","Couple","See your match.","choice"],

["Pixel Painter","🎨","Creative","Paint pixels.","creative"],
["Color Mixer","🌈","Creative","Mix colors.","creative"],
["Drawing Pad","✏️","Creative","Draw anything.","creative"],
["Make A Logo","✨","Creative","Create a logo.","creative"],
["Room Designer","🏠","Creative","Design a room.","creative"],
["Character Creator","🧍","Creative","Build a character.","creative"],
["Outfit Builder","👕","Creative","Choose an outfit.","creative"],
["Sticker Maker","💬","Creative","Make a sticker.","creative"],
["Music Pad","🎵","Creative","Make sounds.","creative"],
["Beat Maker","🥁","Creative","Create a beat.","creative"],
["Name Generator","✨","Creative","Generate names.","creative"],
["Story Builder","📖","Creative","Build a story.","creative"],
["Pixel Art Challenge","🟦","Creative","Copy the pattern.","creative"],
["Emoji Composer","😀","Creative","Compose emojis.","creative"],
["Pattern Creator","🔷","Creative","Create patterns.","creative"],
["Mini Garden","🌱","Creative","Grow a garden.","creative"],
["Virtual Aquarium","🐠","Creative","Build an aquarium.","creative"],
["Digital Pet","🐱","Creative","Take care of a pet.","creative"],
["Tiny World Builder","🌎","Creative","Build a tiny world.","creative"],
["Secret Game","🔐","Creative","The final secret.","secret"]
];

let currentFilter="All";
let currentGame=null;
let gameTimer=null;
let gameScore=0;
let gameData={};
let state=JSON.parse(localStorage.getItem("playbox100"))||{
coins:0,
stars:0,
played:[],
favorites:[],
highscores:{},
sound:true,
vibration:true
};

/* =========================
   SAVE
========================= */

function save(){
localStorage.setItem("playbox100",JSON.stringify(state));
updateStats();
}

function updateStats(){
document.getElementById("coins").textContent=state.coins;
document.getElementById("stars").textContent=state.stars;
}

/* =========================
   RENDER
========================= */

function renderGames(){
const box=document.getElementById("games");
const search=document.getElementById("search").value.toLowerCase();

box.innerHTML="";

games.forEach((g,i)=>{
let name=g[0];
let icon=g[1];
let cat=g[2];

if(currentFilter!=="All" && cat!==currentFilter)return;
if(search && !name.toLowerCase().includes(search))return;

let fav=state.favorites.includes(i);
let high=state.highscores[i]||0;

let card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div class="cardTop">
<div class="icon">${icon}</div>
<button class="fav ${fav?"on":""}" onclick="toggleFav(event,${i})">
${fav?"♥":"♡"}
</button>
</div>

<h4>${i+1}. ${name}</h4>
<p>${g[3]}</p>

<div class="cardBottom">
<span class="cat">${cat}</span>
<span class="high">🏆 ${high}</span>
</div>
`;

card.onclick=()=>openGame(i);

box.appendChild(card);
});

document.getElementById("count").textContent=
box.children.length+" games";
}

function toggleFav(e,i){
e.stopPropagation();

if(state.favorites.includes(i)){
state.favorites=state.favorites.filter(x=>x!==i);
}else{
state.favorites.push(i);
}

save();
renderGames();
}

function filterGames(cat,btn){
currentFilter=cat;

document.querySelectorAll(".nav button").forEach(x=>{
x.classList.remove("active");
});

btn.classList.add("active");
renderGames();
}

/* =========================
   GAME OPEN
========================= */

function openGame(index){

clearInterval(gameTimer);

currentGame=index;
gameScore=0;
gameData={};

let g=games[index];

if(!state.played.includes(index)){
state.played.unshift(index);
state.played=state.played.slice(0,12);
save();
}

document.getElementById("overlay").classList.add("show");

document.getElementById("gameTitle").textContent=
(index+1)+". "+g[0];

document.getElementById("gameCategory").textContent=g[2];

document.getElementById("gameIcon").textContent=g[1];
document.getElementById("introTitle").textContent=g[0];
document.getElementById("gameDesc").textContent=g[3];

loadGame(g[4]);
}

function closeGame(){
clearInterval(gameTimer);
document.getElementById("overlay").classList.remove("show");
renderGames();
}

function finish(score){

clearInterval(gameTimer);

score=Math.max(0,Math.floor(score));

let old=state.highscores[currentGame]||0;

if(score>old){
state.highscores[currentGame]=score;
}

state.coins+=Math.max(1,Math.floor(score/10));
state.stars+=score>=70?1:0;

save();

document.getElementById("gameArea").innerHTML=`
<div class="result">
<div class="emoji">🎉</div>
<h2>Game Complete!</h2>
<p>Your score</p>
<div class="big">${score}</div>
<p>
${score>old?"🔥 NEW HIGH SCORE!":"Keep going and beat your record!"}
</p>

<div class="row">
<button class="primary" onclick="loadGame(games[currentGame][4])">
PLAY AGAIN
</button>
<button class="secondary" onclick="closeGame()">
BACK
</button>
</div>
</div>
`;
}

/* =========================
   GAME LOADER
========================= */

function loadGame(type){

clearInterval(gameTimer);

let area=document.getElementById("gameArea");

switch(type){

case"number": numberGame();break;
case"higher": higherGame();break;
case"odd": oddGame();break;
case"math": mathGame();break;
case"sequence": sequenceGame();break;
case"word": wordGame();break;
case"emoji": emojiGame();break;
case"riddle": riddleGame();break;
case"tf": trueFalseGame();break;
case"trivia": triviaGame();break;
case"choice": choiceGame();break;
case"couple": coupleGame();break;
case"memory": memoryGame();break;
case"target": targetGame();break;
case"tap": tapGame();break;
case"timing": timingGame();break;
case"color": colorGame();break;
case"snake": snakeGame();break;
case"breakout": breakoutGame();break;
case"maze": mazeGame();break;
case"creative": creativeGame();break;
case"logic": logicGame();break;
case"code": codeGame();break;
case"sudoku": sudokuGame();break;
case"secret": secretGame();break;

default:
choiceGame();
}
}

/* =========================
   NUMBER GUESS
========================= */

function numberGame(){

let secret=Math.floor(Math.random()*20)+1;
let tries=0;

gameData.secret=secret;

document.getElementById("gameArea").innerHTML=`
<div class="gstats">
<div class="gs"><b id="tries">0</b><span>TRIES</span></div>
<div class="gs"><b>1-20</b><span>RANGE</span></div>
</div>

<div class="center">
<div class="big">?</div>

<input id="guessInput"
type="number"
min="1"
max="20"
placeholder="Enter number"
style="
width:100%;
padding:13px;
background:#191c24;
border:1px solid #292d39;
border-radius:12px;
color:white;
outline:0;
text-align:center;
">

<div class="row">
<button class="startBtn" onclick="guessNumber()">GUESS</button>
</div>

<div class="msg" id="msg">I'm thinking of a number...</div>
</div>
`;
}

function guessNumber(){

let input=document.getElementById("guessInput");
let n=Number(input.value);

if(!n)return;

gameData.tries++;
document.getElementById("tries").textContent=gameData.tries;

if(n===gameData.secret){
finish(Math.max(20,100-gameData.tries*10));
return;
}

document.getElementById("msg").textContent=
n<gameData.secret?"⬆️ Higher!":"⬇️ Lower!";

input.value="";

function higherGame(){

gameData.current=current;

gameData.round=0;

}

function drawHigher(){

let n=gameData.current;

document.getElementById("gameArea").innerHTML=`
<div class="gstats">
<div class="gs"><b>${gameData.score}</b><span>SCORE</span></div>
<div class="gs"><b>${gameData.round}/8</b><span>ROUND</span></div>

<button class="secondary" onclick="higherAnswer('lower')">⬇️ LOWER</button>
</div>
</div>
`;
}

function higherAnswer(ans){

let next=Math.floor(Math.random()*90)+10;

let correct=
ans==="higher"?next>gameData.current:next<gameData.current;

if(correct)gameData.score+=15;

gameData.round++;
gameData.current=next;

if(gameData.round>=8){
finish(gameData.score);
}else{
drawHigher();
}
}

/* =========================
   QUICK MATH
========================= */

function mathGame(){

let a=Math.floor(Math.random()*20)+1;
let b=Math.floor(Math.random()*20)+1;
let ops=["+","-","×"];
let op=ops[Math.floor(Math.random()*ops.length)];

let answer=
op==="+"?a+b:
op==="-"?a-b:
a*b;

let choices=[answer];

while(choices.length<4){
let x=answer+Math.floor(Math.random()*15)-7;
if(!choices.includes(x))choices.push(x);
}

choices.sort(()=>Math.random()-.5);

gameData.answer=answer;
gameData.score=0;

document.getElementById("gameArea").innerHTML=`
<div class="center">
<p>Solve this:</p>
<div class="big">${a} ${op} ${b}</div>

<div class="answers">
${choices.map(x=>`
<button class="answer" onclick="mathAnswer(this,${x})">${x}</button>
`).join("")}
</div>

<div class="msg" id="msg"></div>
</div>
`;
}

function mathAnswer(btn,x){

if(x===gameData.answer){
btn.classList.add("correct");
finish(100);
}else{
btn.classList.add("wrong");
document.getElementById("msg").textContent="❌ Try again!";
setTimeout(mathGame,500);
}
}

/* =========================
   MEMORY
========================= */

function memoryGame(){

let icons=["🍎","🍌","🍇","🍓"];
let arr=[...icons,...icons].sort(()=>Math.random()-.5);

gameData.cards=arr;
gameData.open=[];
gameData.matches=0;

document.getElementById("gameArea").innerHTML=`
<div class="gstats">
<div class="gs"><b id="matches">0</b><span>MATCHES</span></div>
<div class="gs"><b>4</b><span>PAIRS</span></div>
</div>

<div class="memory" id="memory"></div>
`;

renderMemory();
}

function renderMemory(){

let box=document.getElementById("memory");

box.innerHTML=gameData.cards.map((x,i)=>{

let opened=
gameData.open.includes(i)||
gameData.matched?.includes(i);

return`
<button class="mem" onclick="memoryClick(${i})">
${opened?x:"?"}
</button>
`;

}).join("");
}

function memoryClick(i){

if(gameData.open.includes(i)||
gameData.matched?.includes(i))return;

gameData.open.push(i);
renderMemory();

if(gameData.open.length===2){

let[a,b]=gameData.open;

if(gameData.cards[a]===gameData.cards[b]){

if(!gameData.matched)gameData.matched=[];

gameData.matched.push(a,b);
gameData.matches++;

document.getElementById("matches").textContent=gameData.matches;

gameData.open=[];

if(gameData.matches===4){
setTimeout(()=>finish(100),300);
}else{
renderMemory();
}

}else{

setTimeout(()=>{
gameData.open=[];
renderMemory();
},650);

}

}
}
