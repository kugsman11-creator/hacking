<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<title>PLAYBOX 1000</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#070910;
  --panel:#10131d;
  --panel2:#151927;
  --line:rgba(255,255,255,.09);
  --text:#f7f8ff;
  --muted:#8e95aa;
  --accent:#7c5cff;
  --accent2:#20d9ff;
  --good:#35e39a;
  --bad:#ff5577;
  --gold:#ffd45c;
  --shadow:0 18px 50px rgba(0,0,0,.35);
}
body.light{
  --bg:#f4f6fb;
  --panel:#fff;
  --panel2:#eef1f7;
  --line:rgba(0,0,0,.08);
  --text:#10121a;
  --muted:#697084;
}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  min-height:100%;
  overflow-x:hidden;
}
button,input{
  font:inherit;
}
button{
  border:0;
  color:inherit;
  cursor:pointer;
}
button:active{
  transform:scale(.97);
}
#app{
  min-height:100vh;
  padding-bottom:80px;
}
.top{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(20px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  border-bottom:1px solid var(--line);
}
.nav{
  max-width:1200px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  align-items:center;
  gap:12px;
}
.logo{
  font-weight:900;
  font-size:20px;
  letter-spacing:-.8px;
  white-space:nowrap;
}
.logo span{
  background:linear-gradient(100deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}
.navStats{
  margin-left:auto;
  display:flex;
  gap:7px;
}
.stat{
  background:var(--panel);
  border:1px solid var(--line);
  padding:8px 10px;
  border-radius:12px;
  font-size:12px;
  white-space:nowrap;
}
.navBtn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--panel);
  border:1px solid var(--line);
}
.container{
  max-width:1200px;
  margin:auto;
  padding:22px 18px;
}
.hero{
  position:relative;
  overflow:hidden;
  padding:28px;
  border:1px solid var(--line);
  border-radius:28px;
  background:
    radial-gradient(circle at 85% 15%,rgba(32,217,255,.18),transparent 28%),
    radial-gradient(circle at 20% 80%,rgba(124,92,255,.2),transparent 30%),
    var(--panel);
  box-shadow:var(--shadow);
}
.hero h1{
  margin:0;
  font-size:clamp(32px,7vw,66px);
  line-height:.94;
  letter-spacing:-3px;
}
.hero p{
  color:var(--muted);
  max-width:650px;
  line-height:1.6;
  margin:16px 0;
}
.heroBtns{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.primary{
  background:linear-gradient(110deg,var(--accent),#9b7cff);
  padding:12px 17px;
  border-radius:13px;
  font-weight:800;
}
.secondary{
  background:var(--panel2);
  border:1px solid var(--line);
  padding:12px 17px;
  border-radius:13px;
  font-weight:700;
}
.section{
  margin-top:25px;
}
.sectionHead{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:15px;
  margin-bottom:12px;
}
.sectionHead h2{
  margin:0;
  font-size:20px;
}
.sectionHead span{
  color:var(--muted);
  font-size:12px;
}
.search{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  padding:14px 16px;
  border-radius:15px;
  outline:none;
}
.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 0 4px;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filter{
  flex:none;
  background:var(--panel);
  border:1px solid var(--line);
  padding:9px 13px;
  border-radius:999px;
  color:var(--muted);
  font-size:12px;
}
.filter.active{
  color:white;
  background:var(--accent);
  border-color:var(--accent);
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.card{
  position:relative;
  min-height:190px;
  padding:15px;
  background:linear-gradient(145deg,var(--panel),var(--panel2));
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  transition:.2s;
}
.card:hover{
  transform:translateY(-2px);
  border-color:rgba(124,92,255,.45);
}
.cardTop{
  display:flex;
  justify-content:space-between;
  align-items:start;
}
.icon{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:rgba(124,92,255,.14);
  font-size:22px;
}
.fav{
  width:34px;
  height:34px;
  background:transparent;
  color:#747b91;
  font-size:18px;
}
.fav.on{color:#ff5d8a}
.card h3{
  margin:13px 0 5px;
  font-size:15px;
}
.card p{
  margin:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
}
.levelRow{
  display:flex;
  justify-content:space-between;
  margin-top:13px;
  color:var(--muted);
  font-size:10px;
}
.progress{
  height:5px;
  border-radius:99px;
  background:rgba(255,255,255,.07);
  margin-top:7px;
  overflow:hidden;
}
.progress i{
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}
.card button.play{
  width:100%;
  margin-top:12px;
  padding:10px;
  border-radius:11px;
  background:var(--panel2);
  border:1px solid var(--line);
  font-weight:800;
  font-size:12px;
}
.more{
  display:block;
  margin:20px auto;
  padding:12px 20px;
  border-radius:13px;
  background:var(--panel);
  border:1px solid var(--line);
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}
.bottomIn{
  max-width:650px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}
.bottom button{
  background:transparent;
  color:var(--muted);
  padding:7px 3px;
  font-size:10px;
}
.bottom button b{
  display:block;
  font-size:18px;
  margin-bottom:2px;
}
.bottom button.active{color:var(--text)}
.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(4,5,10,.82);
  backdrop-filter:blur(18px);
  padding:12px;
}
.overlay.show{display:flex}
.gameWindow{
  width:min(850px,100%);
  height:min(92vh,900px);
  margin:auto;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}
.gameHead{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 15px;
  border-bottom:1px solid var(--line);
}
.gameTitle{
  flex:1;
}
.gameTitle strong{
  display:block;
  font-size:14px;
}
.gameTitle small{
  color:var(--muted);
}
.close{
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--panel2);
}
.gameBody{
  flex:1;
  overflow:auto;
  padding:18px;
}
.gameStats{
  display:flex;
  gap:7px;
  margin-bottom:15px;
}
.gstat{
  flex:1;
  padding:9px;
  text-align:center;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:12px;
}
.gstat small{
  display:block;
  color:var(--muted);
  font-size:9px;
}
.gstat b{font-size:14px}
.arena{
  position:relative;
  min-height:350px;
  border-radius:22px;
  overflow:hidden;
  border:1px solid var(--line);
  background:
    radial-gradient(circle at 50% 30%,rgba(124,92,255,.12),transparent 45%),
    #080b13;
}
.arena canvas{
  width:100%;
  height:100%;
  min-height:350px;
  display:block;
  touch-action:none;
}
.centerGame{
  min-height:350px;
  display:grid;
  place-items:center;
  text-align:center;
}
.bigEmoji{
  font-size:70px;
  margin-bottom:10px;
}
.gamePrompt{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.5px;
}
.sub{
  color:var(--muted);
  font-size:13px;
  margin:8px 0 18px;
}
.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.option{
  min-height:56px;
  padding:12px;
  border-radius:14px;
  background:var(--panel2);
  border:1px solid var(--line);
  color:var(--text);
  font-weight:800;
}
.option:hover{
  border-color:var(--accent);
}
.bigAction{
  width:min(320px,100%);
  min-height:120px;
  border-radius:25px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-size:28px;
  font-weight:1000;
  box-shadow:0 15px 45px rgba(124,92,255,.25);
}
.inputRow{
  display:flex;
  gap:8px;
}
.inputRow input{
  flex:1;
  min-width:0;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:13px;
  color:var(--text);
  padding:13px;
  outline:none;
}
.message{
  text-align:center;
  color:var(--muted);
  margin-top:14px;
  min-height:20px;
}
.result{
  position:absolute;
  inset:0;
  z-index:5;
  display:none;
  place-items:center;
  background:rgba(7,9,16,.88);
  backdrop-filter:blur(12px);
  text-align:center;
  padding:25px;
}
.result.show{display:grid}
.resultBox{
  width:min(420px,100%);
}
.result h2{
  font-size:36px;
  margin:0 0 8px;
}
.result p{color:var(--muted)}
.resultBtns{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:18px;
}
.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  z-index:300;
  opacity:0;
  pointer-events:none;
  background:#181c2a;
  border:1px solid var(--line);
  padding:11px 15px;
  border-radius:14px;
  font-size:12px;
  transition:.25s;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
.confetti{
  position:fixed;
  z-index:400;
  width:8px;
  height:8px;
  pointer-events:none;
  animation:fall 1.3s ease-out forwards;
}
@keyframes fall{
  to{
    transform:translate(var(--x),var(--y)) rotate(720deg);
    opacity:0;
  }
}
.hidden{display:none!important}
.empty{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
}
.statsPanel{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.bigStat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
}
.bigStat b{
  display:block;
  font-size:26px;
}
.bigStat span{
  color:var(--muted);
  font-size:11px;
}
.achievement{
  padding:14px;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--panel);
  margin-bottom:8px;
}
.achievement.locked{opacity:.45}
.achievement b{display:block}
.achievement span{font-size:11px;color:var(--muted)}
.range{
  width:100%;
}
@media(min-width:700px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero{padding:42px}
  .statsPanel{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>
<div id="app"></div>

<div class="overlay" id="overlay">
  <div class="gameWindow">
    <div class="gameHead">
      <div class="gameTitle" id="gameTitle"></div>
      <button class="close" onclick="closeGame()">✕</button>
    </div>
    <div class="gameBody" id="gameBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   PLAYBOX 1000
   100 CORE MECHANICS × 10 VARIANTS = 1,000 GAMES
========================================================= */

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));

const categories=[
 "All","Brain","Reflex","Arcade","Puzzle","Words",
 "Memory","Math","Action","Creative","Couple","Chill"
];

const coreGames=[
 ["Memory Match","🧠","Memory","memory","Match the hidden pairs."],
 ["Number Guess","🔢","Math","guess","Find the secret number."],
 ["Higher or Lower","⬆️","Brain","higher","Predict the next number."],
 ["Odd One Out","👀","Brain","odd","Find what does not belong."],
 ["Quick Math","➗","Math","math","Solve before time runs out."],
 ["Color Logic","🎨","Puzzle","color","Follow the color rule."],
 ["Pattern Memory","🧩","Memory","pattern","Remember the sequence."],
 ["Sequence","🔢","Brain","sequence","Complete the sequence."],
 ["Missing Number","❓","Math","missing","Find the missing value."],
 ["Word Scramble","🔤","Words","word","Unscramble the word."],
 ["Anagram","📝","Words","word","Build the hidden word."],
 ["Emoji Guess","😎","Brain","emoji","Guess the clue."],
 ["Riddle Rush","💡","Brain","riddle","Solve the riddle."],
 ["True or False","⚖️","Brain","tf","Choose correctly."],
 ["Trivia","🌎","Brain","trivia","Test your knowledge."],
 ["Reaction Quiz","⚡","Reflex","reaction","React at exactly the right time."],
 ["Spot Difference","🔎","Puzzle","spot","Find the different tile."],
 ["Logic Grid","🗂️","Puzzle","logic","Use the clues."],
 ["Code Breaker","🔐","Puzzle","code","Crack the code."],
 ["Mini Sudoku","9️⃣","Puzzle","sudoku","Complete the mini grid."],

 ["Tap Target","🎯","Reflex","target","Tap the target."],
 ["Reaction Test","⚡","Reflex","reaction","React as fast as possible."],
 ["Don't Tap Red","🔴","Reflex","dontred","Avoid the danger."],
 ["Falling Objects","⬇️","Reflex","fall","Catch the good ones."],
 ["Catch Coin","🪙","Reflex","catch","Catch every coin."],
 ["Dodge","💨","Action","dodge","Survive the incoming objects."],
 ["Speed Tap","👆","Reflex","speedtap","Tap as fast as possible."],
 ["Timing Bar","⏱️","Reflex","timing","Stop the bar perfectly."],
 ["Moving Target","🎯","Reflex","moving","Hit moving targets."],
 ["Quick Click","🖱️","Reflex","click","Click every target."],
 ["Avoid Walls","🧱","Action","walls","Navigate without crashing."],
 ["Color Tap","🌈","Reflex","colortap","Tap the requested color."],
 ["Hit Circle","⭕","Reflex","circle","Hit the circle."],
 ["Laser Dodge","🔦","Action","laser","Avoid laser lines."],
 ["Falling Blocks","🟦","Action","blocks","Survive the blocks."],
 ["Reflex Memory","🧠","Reflex","reflexmemory","Remember and react."],
 ["One Second","⏳","Reflex","second","Stop exactly on time."],
 ["Fast Finger","🔥","Reflex","fast","Prove your speed."],
 ["Perfect Timing","🎯","Reflex","perfect","Hit the perfect zone."],
 ["Impossible Button","😈","Reflex","impossible","Press it if you can."],

 ["Snake","🐍","Arcade","snake","Grow without crashing."],
 ["Breakout","🧱","Arcade","breakout","Destroy the bricks."],
 ["Flappy Flight","🐦","Arcade","flappy","Fly through the gaps."],
 ["Mini Runner","🏃","Arcade","runner","Run as far as possible."],
 ["Space Shooter","🚀","Action","shooter","Destroy incoming enemies."],
 ["Asteroid Dodge","☄️","Action","asteroid","Survive the asteroid field."],
 ["Coin Collector","💰","Arcade","collector","Collect everything."],
 ["Maze Escape","🌀","Puzzle","maze","Find the exit."],
 ["Platform Jump","🪜","Arcade","jump","Climb higher."],
 ["Tower Stack","🏗️","Arcade","stack","Build the tallest tower."],
 ["Ball Bounce","⚽","Arcade","bounce","Keep the ball alive."],
 ["Brick Breaker","🔨","Arcade","brick","Break every block."],
 ["Mini Golf","⛳","Arcade","golf","Reach the hole."],
 ["Pinball","🎰","Arcade","pinball","Keep your ball in play."],
 ["Endless Road","🛣️","Action","road","Drive without crashing."],
 ["Car Dodge","🚗","Action","car","Avoid traffic."],
 ["Rocket Launch","🚀","Arcade","rocket","Reach the target height."],
 ["Balloon Pop","🎈","Reflex","balloon","Pop before they escape."],
 ["Target Shooter","🏹","Action","shoot","Hit every target."],
 ["Survival Arena","⚔️","Action","survival","Survive every wave."],

 ["Who Knows Who?","💜","Couple","choice","How well do you know each other?"],
 ["This or That","✨","Couple","choice","Pick your favorite."],
 ["Guess My Answer","💭","Couple","choice","Predict the answer."],
 ["Favorite Things","💖","Couple","choice","Remember the favorites."],
 ["Memory of Us","📸","Couple","memory","Remember your moments."],
 ["Finish My Sentence","💬","Couple","word","Finish the thought."],
 ["Emoji Story","🥰","Couple","emoji","Decode the story."],
 ["Pick One","🎀","Couple","choice","Choose one."],
 ["Random Question","💌","Couple","question","Answer honestly."],
 ["Would You Rather","🤍","Couple","choice","Choose your side."],
 ["Guess the Song","🎵","Couple","trivia","Guess the song."],
 ["Guess the Movie","🎬","Couple","trivia","Guess the movie."],
 ["Couple Trivia","💕","Couple","trivia","Test your shared knowledge."],
 ["Secret Question","🔒","Couple","question","A new question every round."],
 ["Truth or Dare","🎲","Couple","choice","Choose your challenge."],
 ["Mood Picker","🌙","Couple","choice","Pick today's mood."],
 ["Compliment Generator","💐","Couple","compliment","Create a sweet message."],
 ["Date Idea","🌹","Couple","choice","Choose an idea."],
 ["Future Guess","🔮","Couple","choice","Make a playful prediction."],
 ["Compatibility","💞","Couple","compat","Build your score."],

 ["Pixel Painter","🖌️","Creative","paint","Create pixel art."],
 ["Color Mixer","🎨","Creative","color","Mix the requested color."],
 ["Drawing Pad","✏️","Creative","draw","Draw anything."],
 ["Logo Maker","🔷","Creative","paint","Build a tiny logo."],
 ["Room Designer","🏠","Creative","choice","Design your room."],
 ["Character Creator","🧑","Creative","choice","Build your character."],
 ["Outfit Builder","👕","Creative","choice","Create an outfit."],
 ["Sticker Maker","⭐","Creative","paint","Make a sticker."],
 ["Music Pad","🎹","Creative","music","Play the pads."],
 ["Beat Maker","🥁","Creative","music","Build a beat."],
 ["Name Generator","✨","Creative","name","Generate a new identity."],
 ["Story Builder","📖","Creative","story","Build the story."],
 ["Pixel Challenge","🟪","Creative","paint","Copy the pattern."],
 ["Emoji Composer","😀","Creative","emoji","Compose an emoji scene."],
 ["Pattern Creator","🔲","Creative","pattern","Complete the pattern."],
 ["Mini Garden","🌱","Chill","garden","Grow your garden."],
 ["Virtual Aquarium","🐠","Chill","aquarium","Build your aquarium."],
 ["Digital Pet","🐶","Chill","pet","Take care of your pet."],
 ["Tiny World","🌍","Creative","world","Build a tiny world."],
 ["Secret Game","🗝️","Chill","secret","Discover the hidden game."]
];

/* Add 10 variants per core game = 1000 */
const variantNames=[
 "Classic","Neon","Turbo","Zen","Chaos","Cosmic","Candy","Midnight","Pro","Ultimate"
];
const variantIcons=[
 "◆","✦","⚡","◌","☄","✺","●","☾","◆","★"
];

const games=[];
let id=1;

coreGames.forEach((g,coreIndex)=>{
  for(let v=0;v<10;v++){
    games.push({
      id:id++,
      core:coreIndex,
      name:g[0]+" • "+variantNames[v],
      base:g[0],
      icon:g[1],
      variant:variantNames[v],
      variantIcon:variantIcons[v],
      cat:g[2],
      type:g[3],
      desc:g[4]
    });
  }
});

const KEY="PLAYBOX1000_V1";

let state={
  coins:0,
  xp:0,
  stars:0,
  played:0,
  streak:0,
  bestOverall:0,
  favorites:[],
  recent:[],
  progress:{},
  achievements:{},
  theme:"dark",
  sound:true,
  vibration:true,
  totalWins:0,
  totalFails:0
};

try{
  const saved=localStorage.getItem(KEY);
  if(saved) state={...state,...JSON.parse(saved)};
}catch(e){}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
}

function getProg(gameId){
  if(!state.progress[gameId]){
    state.progress[gameId]={
      level:1,
      xp:0,
      coins:0,
      stars:0,
      best:0,
      wins:0,
      fails:0
    };
  }
  return state.progress[gameId];
}

function difficulty(level){
  if(level<5) return ["EASY",1];
  if(level<10) return ["NORMAL",1.15];
  if(level<20) return ["HARD",1.35];
  if(level<35) return ["EXPERT",1.6];
  if(level<50) return ["INSANE",1.9];
  if(level<75) return ["MASTER",2.25];
  return ["NIGHTMARE",2.7];
}

function variantModifier(game){
  return 1+(game.id%10)*.035;
}

function xpNeed(level){
  return Math.floor(80+level*30+Math.pow(level,1.22)*10);
}

function totalLevel(){
  return Object.values(state.progress)
    .reduce((a,p)=>a+p.level-1,0);
}

function pctFor(p){
  return Math.min(100,((p.xp/xpNeed(p.level))*100));
}

function startGame(id){
  stopLoops();

  activeGame=games.find(g=>g.id===id);
  activeProg=getProg(id);

  state.played++;

  state.recent=[
    id,
    ...state.recent.filter(x=>x!==id)

  save();

  $("#overlay").classList.add("show");

  $("#gameTitle").innerHTML=`

    <small>
      Level ${activeProg.level} · ${difficulty(activeProg.level)[0]}

  renderGame();
}

function closeGame(){
  stopLoops();
  $("#overlay").classList.remove("show");
  activeGame=null;
  activeProg=null;
  render();
}

function stopLoops(){
  if(gameTimer){
    clearTimeout(gameTimer);
    clearInterval(gameTimer);
    gameTimer=null;
  }

  if(animation){
    cancelAnimationFrame(animation);
    animation=null;
  }
}

function win(score=100){
  if(!activeGame||!activeProg)return;

  stopLoops();

  score=Math.max(1,Math.floor(score));

  const level=activeProg.level;

  const reward=Math.floor(
    10+
    level*2+
    score/30
  );

  const starReward=
    level%10===0?3:
    level%5===0?2:1;

  activeProg.best=Math.max(activeProg.best,score);
  activeProg.wins++;
  activeProg.xp+=score;
  activeProg.coins+=reward;
  activeProg.stars+=starReward;

  state.xp+=score;
  state.coins+=reward;
  state.stars+=starReward;
  state.totalWins++;
  state.streak++;
  state.bestOverall=Math.max(state.bestOverall,score);

  save();

  confetti();

  const next=level+1;
  const nextDiff=difficulty(next)[0];

  $("#result").classList.add("show");

  $("#resultBox").innerHTML=`
    <div style="font-size:55px">🏆</div>

    <h2>LEVEL CLEARED!</h2>

    <p>
      ${esc(activeGame.name)} · Level ${level}

      <div class="bigStat">
        <b>+${score}</b><span>Score</span>
      </div>

        <b>+${reward}</b><span>Coins</span>
      </div>
      <div class="bigStat">
        <b>+${starReward}</b><span>Stars</span>
      </div>
      <div class="bigStat">
        <b>LV ${next}</b><span>${nextDiff}</span>
      </div>
    </div>

    ${
      level%10===0
      ? `<div style="margin-top:15px;color:var(--gold);font-weight:900">
          👑 BOSS CHECKPOINT CLEARED
        </div>`
      :""
    }

      <button class="secondary" onclick="closeGame()">Exit</button>
      <button class="primary" onclick="nextLevel()">NEXT LEVEL →</button>

  setTimeout(()=>{

  },2200);

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;

function shuffle(a){
  return [...a].sort(()=>Math.random()-.5);
}

function randomItem(a){
  return a[Math.floor(Math.random()*a.length)];
}

function successTap(el,fn){
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();
    fn(e);

}

/* =========================================================
   MEMORY
========================================================= */

function memoryGame(g,level,mult){
  const pairs=Math.min(12,2+Math.floor(level/2));
  const symbols=["🍎","🍋","🍒","🍇","🍉","🥝","🍑","🥥","🌸","⭐","🔥","💎"];

  let cards=shuffle(symbols.slice(0,pairs).flatMap(x=>[x,x]));
  let open=[];
  let matched=0;
  let locked=false;

  $("#gameContent").innerHTML=`
    <div style="
      display:grid;
      grid-template-columns:repeat(${pairs>8?4:4},1fr);
      gap:8px;
      max-width:520px;
      margin:auto
    " id="memoryGrid"></div>
  `;

  const grid=$("#memoryGrid");

  cards.forEach((symbol,i)=>{
    const b=document.createElement("button");
    b.className="option";
    b.style.minHeight="65px";
    b.textContent="？";

    successTap(b,()=>{
      if(locked||b.dataset.done==="1"||open.includes(i))return;

      b.textContent=symbol;
      open.push(i);

      if(open.length===2){
        locked=true;

        const a=grid.children[open[0]];
        const c=grid.children[open[1]];

        if(cards[open[0]]===cards[open[1]]){
          a.dataset.done="1";
          c.dataset.done="1";
          matched++;
          open=[];
          locked=false;

          setScore(matched*100*mult);
          setCombo(matched);

          if(matched===pairs){
            win(matched*100*mult);
          }
        }else{
          setTimeout(()=>{
            a.textContent="？";
            c.textContent="？";
            open=[];
            locked=false;
          },550);
        }
      }
    });

    grid.appendChild(b);
  });
}

/* =========================================================
   MATH
========================================================= */

function mathGame(g,level,mult){
  const max=Math.min(999,8+level*5);
  let a=rand(2,max);
  let b=rand(1,max);

  const ops=
    level<5?["+","-"]:
    level<15?["+","-","×"]:
    ["+","-","×","÷"];

  let op=randomItem(ops);
  let answer;

  if(op==="+")answer=a+b;
  if(op==="-"){
    if(b>a)[a,b]=[b,a];
    answer=a-b;
  }
  if(op==="×")answer=a*b;
  if(op==="÷"){
    b=rand(2,Math.max(2,Math.floor(max/4)));
    answer=rand(2,Math.max(2,Math.floor(max/5)));
    a=b*answer;
  }

  const options=shuffle([
    answer,
    answer+rand(1,Math.max(2,level+2)),
    answer-rand(1,Math.max(2,level+2)),
    answer+rand(2,Math.max(3,level+5))
  ]);

  basicCenter(`
    <div class="gamePrompt">${a} ${op} ${b} = ?</div>
    <div class="sub">Solve it. Difficulty increases every level.</div>

    <div class="options">
      ${options.map(x=>`
        <button class="option" onclick="mathAnswer(${x},${answer},${level},${mult})">
          ${x}
        </button>
      `).join("")}
    </div>
  `);
}

window.mathAnswer=function(x,a,level,mult){
  if(x===a)win(Math.floor((100+level*8)*mult));
  else fail("Wrong answer.");
};

========================================================= */

function targetGame(g,level,mult){
  const arena=$("#gameContent");

  arena.style.position="relative";
  arena.style.minHeight="350px";

  const rounds=Math.min(15,3+Math.floor(level/3));
  let hit=0;
  let score=0;
  let size=Math.max(28,75-level*1.3);

  function spawn(){
    arena.innerHTML="";

    const target=document.createElement("button");
    target.textContent=g.variantIcon;
    target.style.position="absolute";
    target.style.width=size+"px";
    target.style.height=size+"px";
    target.style.borderRadius="50%";
    target.style.background="linear-gradient(135deg,#7c5cff,#20d9ff)";
    target.style.boxShadow="0 0 30px rgba(124,92,255,.45)";
    target.style.left=rand(5,90)+"%";
    target.style.top=rand(5,85)+"%";
    target.style.fontSize=Math.max(12,size/2)+"px";

    successTap(target,()=>{
      hit++;
      score+=Math.floor(100*mult+(100-level));
      setScore(score);
      setCombo(hit);

      if(hit>=rounds){
        win(score);
      }else{
        spawn();
      }
    });

    arena.appendChild(target);
  }

  spawn();
}

  basicCenter(`

  successTap(btn,()=>{
    if(!ready){

    const time=performance.now()-start;

/* =========================================================

function higherGame(g,level,mult){
  let current=rand(1,20+level*2);
  let score=0;
  let rounds=Math.min(10,3+Math.floor(level/3));

  function draw(){
    const next=rand(1,20+level*2);

    basicCenter(`

        <button class="option" id="lower">⬇ Lower</button>

      <div class="message">Round ${score/100+1}/${rounds}</div>
    `);

    $("#higher").onclick=()=>choose("higher",next);
    $("#lower").onclick=()=>choose("lower",next);

    function choose(choice,n){
      const correct=
        n===current
        ?Math.random()>.5
        :(choice==="higher"?n>current:n<current);

      if(!correct){
        fail("Wrong prediction.");
        return;
      }

      current=n;
      score+=Math.floor(100*mult);
      setScore(score);
      setCombo(score/100);

      if(score/100>=rounds)win(score);
      else draw();
    }
  }

  draw();
}

function canvasGame(g,level,mult,mode){
  const content=$("#gameContent");

  content.innerHTML=`
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="message" id="canvasMsg">
      Touch / drag to control.
    </div>
  `;

  const canvas=$("#gameCanvas");
  const ctx=canvas.getContext("2d");

  let W=800,H=500;
  let running=true;
  let score=0;
  let player={
    x:W/2,
    y:H-55,
    r:18
  };

  let objects=[];
  let last=performance.now();
  let elapsed=0;

  const speed=1.5+level*.045;
  const spawnRate=Math.max(230,900-level*8);

  function resize(){
    const rect=canvas.getBoundingClientRect();
    canvas.width=800;
    canvas.height=500;
  }

  resize();

  function pointer(e){
    const r=canvas.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*W;
    const y=(e.clientY-r.top)/r.height*H;

    player.x=Math.max(20,Math.min(W-20,x));
    player.y=Math.max(20,Math.min(H-20,y));
  }

  canvas.addEventListener("pointermove",pointer);
  canvas.addEventListener("pointerdown",pointer);

  function spawn(){
    objects.push({
      x:rand(20,780),
      y:-30,
      r:rand(10,25),
      vy:speed+Math.random()*2,
      good:Math.random()>.22
    });
  }

  let nextSpawn=0;

  function loop(now){
    if(!running)return;

    const dt=Math.min(32,now-last);
    last=now;
    elapsed+=dt;
    nextSpawn-=dt;

    if(nextSpawn<=0){
      spawn();
      nextSpawn=spawnRate;
    }

    ctx.clearRect(0,0,W,H);

    /* background */
    ctx.fillStyle="#080b13";
    ctx.fillRect(0,0,W,H);

    /* grid */
    ctx.strokeStyle="rgba(255,255,255,.04)";
    for(let x=0;x<W;x+=40){
      ctx.beginPath();
      ctx.moveTo(x,0);
      ctx.lineTo(x,H);
      ctx.stroke();
    }
    for(let y=0;y<H;y+=40){
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.lineTo(W,y);
      ctx.stroke();
    }

    /* player */
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
    ctx.fillStyle="#20d9ff";
    ctx.shadowBlur=25;
    ctx.shadowColor="#20d9ff";
    ctx.fill();
    ctx.shadowBlur=0;

    for(let i=objects.length-1;i>=0;i--){
      const o=objects[i];
      o.y+=o.vy*(dt/16);

      ctx.beginPath();
      ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
      ctx.fillStyle=o.good?"#35e39a":"#ff5577";
      ctx.fill();

      const dx=o.x-player.x;
      const dy=o.y-player.y;

      if(Math.hypot(dx,dy)<o.r+player.r){
        if(o.good){
          score+=Math.floor(25*mult);
          setScore(score);
          objects.splice(i,1);
          continue;
        }else{
          running=false;
          fail("You hit a danger object.");
          return;
        }
      }

      if(o.y>H+50){
        objects.splice(i,1);
      }
    }

    if(elapsed>Math.max(5000,7000+level*180)){
      running=false;
      win(Math.floor(score+200*mult));
      return;
    }

    animation=requestAnimationFrame(loop);
  }

  animation=requestAnimationFrame(loop);
}

/* =========================================================
   SNAKE
========================================================= */

function snakeGame(g,level,mult){
  const content=$("#gameContent");

  content.innerHTML=`
    <canvas id="snakeCanvas" width="600" height="600"></canvas>
    <div class="message">
      Swipe / drag around the board.
    </div>
  `;

  const canvas=$("#snakeCanvas");
  const ctx=canvas.getContext("2d");

  const N=20;
  let snake=[
    {x:10,y:10},
    {x:9,y:10},
    {x:8,y:10}
  ];

  let dir={x:1,y:0};
  let next={x:1,y:0};

  let food={
    x:rand(1,N-2),
    y:rand(1,N-2)
  };

  let score=0;
  let running=true;
  let last=0;
  const delay=Math.max(65,150-level*2);

  function input(e){
    const r=canvas.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*N;
    const y=(e.clientY-r.top)/r.height*N;
    const head=snake[0];

    const dx=x-head.x;
    const dy=y-head.y;

    if(Math.abs(dx)>Math.abs(dy)){
      if(dx>0 && dir.x!==-1)next={x:1,y:0};
      if(dx<0 && dir.x!==1)next={x:-1,y:0};
    }else{
      if(dy>0 && dir.y!==-1)next={x:0,y:1};
      if(dy<0 && dir.y!==1)next={x:0,y:-1};
    }
  }

  canvas.addEventListener("pointerdown",input);
  canvas.addEventListener("pointermove",e=>{
    if(e.buttons)input(e);
  });

  function loop(t){
    if(!running)return;

    if(t-last>delay){
      last=t;
      dir=next;

      const head={
        x:snake[0].x+dir.x,
        y:snake[0].y+dir.y
      };

      if(
        head.x<0||
        head.y<0||
        head.x>=N||
        head.y>=N||
        snake.some(s=>s.x===head.x&&s.y===head.y)
      ){
        running=false;
        fail("Snake crashed.");
        return;
      }

      snake.unshift(head);

      if(head.x===food.x&&head.y===food.y){
        score+=100;
        setScore(score);

        food={
          x:rand(1,N-2),
          y:rand(1,N-2)
        };

        if(score>=Math.max(300,level*100)){
          running=false;
          win(score*mult);
          return;
        }
      }else{
        snake.pop();
      }
    }

    ctx.fillStyle="#080b13";
    ctx.fillRect(0,0,600,600);

    const s=600/N;

    snake.forEach((p,i)=>{
      ctx.fillStyle=i===0?"#20d9ff":"#7c5cff";
      ctx.fillRect(p.x*s+2,p.y*s+2,s-4,s-4);
    });

    ctx.fillStyle="#35e39a";
    ctx.beginPath();
    ctx.arc(
      food.x*s+s/2,
      food.y*s+s/2,
      s*.3,
      0,
      Math.PI*2
    );
    ctx.fill();

    animation=requestAnimationFrame(loop);
  }

  animation=requestAnimationFrame(loop);
}

   BREAKOUT
========================================================= */

function breakoutGame(g,level,mult){
  const content=$("#gameContent");

  content.innerHTML=`
    <canvas id="breakCanvas" width="800" height="500"></canvas>
    <div class="message">
      Move your finger to control the paddle.
    </div>
  `;

  const c=$("#breakCanvas");
  const ctx=c.getContext("2d");

  let paddle={x:350,w:100,h:15};
  let ball={x:400,y:430,vx:3+level*.03,vy:-4-level*.035,r:9};

  const rows=Math.min(8,2+Math.floor(level/4));
  const cols=8;
  const bricks=[];

  for(let r=0;r<rows;r++){
    for(let col=0;col<cols;col++){
      bricks.push({
        x:55+col*88,
        y:45+r*25,
        w:75,
        h:16,
        alive:true
      });
    }
  }

  let score=0;
  let last=performance.now();

  function move(e){
    const r=c.getBoundingClientRect();
    paddle.x=(e.clientX-r.left)/r.width*800-paddle.w/2;
    paddle.x=Math.max(0,Math.min(800-paddle.w,paddle.x));
  }

  c.addEventListener("pointermove",move);
  c.addEventListener("pointerdown",move);

  function loop(now){
    const dt=Math.min(32,now-last);
    last=now;

    ball.x+=ball.vx*(dt/16);
    ball.y+=ball.vy*(dt/16);

    if(ball.x<ball.r||ball.x>800-ball.r)ball.vx*=-1;
    if(ball.y<ball.r)ball.vy*=-1;

    if(
      ball.y+ball.r>450 &&
      ball.x>paddle.x &&
      ball.x<paddle.x+paddle.w
    ){
      ball.vy=-Math.abs(ball.vy);
    }

    bricks.forEach(b=>{
      if(!b.alive)return;

      if(
        ball.x>b.x &&
        ball.x<b.x+b.w &&
        ball.y>b.y &&
        ball.y<b.y+b.h
      ){
        b.alive=false;
        ball.vy*=-1;
        score+=100;
        setScore(score);
      }
    });

    if(ball.y>520){
      fail("The ball fell.");
      return;
    }

    if(bricks.every(b=>!b.alive)){
      win(score*mult);
      return;
    }

    ctx.fillStyle="#080b13";
    ctx.fillRect(0,0,800,500);

    bricks.forEach(b=>{
      if(b.alive){
        ctx.fillStyle="#7c5cff";
        ctx.fillRect(b.x,b.y,b.w,b.h);
      }
    });

    ctx.fillStyle="#20d9ff";
    ctx.fillRect(paddle.x,450,paddle.w,paddle.h);

    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    ctx.fill();

    animation=requestAnimationFrame(loop);
  }

  animation=requestAnimationFrame(loop);
}

function runnerGame(g,level,mult){

  `;

  let player={
    x:100,
    y:350,
    vy:0,
    w:35,
    h:45,
    grounded:true
  };

  let obstacles=[];
  let score=0;
  let last=performance.now();
  let spawn=0;
  let speed=4+level*.08;

  function jump(){
    if(player.grounded){
      player.vy=-11-Math.min(5,level*.03);
      player.grounded=false;
    }
  }

  c.addEventListener("pointerdown",jump);

  function loop(now){
    const dt=Math.min(32,now-last);
    last=now;

    player.vy+=.55*(dt/16);
    player.y+=player.vy*(dt/16);

    if(player.y>=350){
      player.y=350;
      player.vy=0;
      player.grounded=true;
    }

    spawn-=dt;

    if(spawn<=0){
      obstacles.push({
        x:820,
        y:365,
        w:25+rand(0,20),
        h:30+rand(0,35)
      });

      spawn=Math.max(420,900-level*7);
    }

    obstacles.forEach(o=>{
      o.x-=speed*(dt/16);
    });

    for(const o of obstacles){
      if(
        player.x<o.x+o.w &&
        player.x+player.w>o.x &&
        player.y<o.y+o.h &&
        player.y+player.h>o.y
      ){
        fail("You hit an obstacle.");
        return;
      }
    }

    obstacles=obstacles.filter(o=>o.x>-100);

    score+=Math.floor(dt/10);
    setScore(score);

    if(score>=Math.max(500,level*130)){
      win(score*mult);
      return;
    }

    ctx.fillStyle="#080b13";
    ctx.fillRect(0,0,800,450);

    ctx.fillStyle="#151927";
    ctx.fillRect(0,410,800,40);

    ctx.fillStyle="#20d9ff";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    ctx.fillStyle="#ff5577";
    obstacles.forEach(o=>{
      ctx.fillRect(o.x,o.y,o.w,o.h);
    });

    animation=requestAnimationFrame(loop);
  }

  animation=requestAnimationFrame(loop);
}

        flex-wrap:wrap
      ">

      </div>
    </div>
  `;

  const c=$("#paintCanvas");
  const ctx=c.getContext("2d");
  ctx.lineWidth=Math.max(3,7-level*.05);
  ctx.lineCap="round";
  ctx.strokeStyle="#7c5cff";

  let drawing=false;
  let strokes=0;

  function pos(e){
    const r=c.getBoundingClientRect();
    return {
      x:(e.clientX-r.left)*600/r.width,
      y:(e.clientY-r.top)*420/r.height
    };
  }

  c.addEventListener("pointerdown",e=>{
    drawing=true;
    const p=pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
  });

  c.addEventListener("pointermove",e=>{
    if(!drawing)return;
    const p=pos(e);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    strokes++;
  });

  c.addEventListener("pointerup",()=>drawing=false);
  c.addEventListener("pointerleave",()=>drawing=false);

  window.clearPaint=()=>{
    ctx.clearRect(0,0,600,420);
    strokes=0;
  };

  window.finishPaint=()=>{
    if(strokes<5){
      fail("Draw a little more first.");
    }else{
      win(Math.floor((200+strokes)*mult));
    }
  };

      <button class="option" id="sleep">😴 Sleep</button>
    </div>

    <div class="message">
      Fill the happiness meter to 100%.
    </div>
  `);

  let points=0;

  ["feed","play","pet","sleep"].forEach(id=>{
    $("#"+id).onclick=()=>{
      points+=rand(10,25);
      happiness=Math.min(100,happiness+points/10);
      $("#happy").textContent=Math.floor(happiness);

      if(happiness>=100){
        win(Math.floor((200+level*20)*mult));
      }
    };
  });
}

========================================================= */

function toggleFav(id){
  if(state.favorites.includes(id)){
    state.favorites=state.favorites.filter(x=>x!==id);
    toast("Removed from favorites");
  }else{
    state.favorites.push(id);
    toast("Added to favorites ❤️");
  }

  save();
  render();
}

function randomGame(){
  startGame(randomItem(games).id);
}

function continueGame(){
  const list=state.recent.length
    ? state.recent
    : [1];

  startGame(randomItem(list));
}

/* =========================================================
   TOAST / EFFECTS
========================================================= */

function toast(text){
  const t=$("#toast");
  t.textContent=text;
  t.classList.add("show");

  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>{
    t.classList.remove("show");
  },1600);
}

function confetti(){
  for(let i=0;i<35;i++){
    const c=document.createElement("i");
    c.className="confetti";

    c.style.left=(45+Math.random()*10)+"%";
    c.style.top="45%";
    c.style.background=[
      "#7c5cff",
      "#20d9ff",
      "#35e39a",
      "#ffd45c",
      "#ff5577"
    ][rand(0,4)];

    c.style.setProperty("--x",(Math.random()*500-250)+"px");
    c.style.setProperty("--y",(Math.random()*600-100)+"px");

    document.body.appendChild(c);

    setTimeout(()=>c.remove(),1400);
  }

  if(state.vibration && navigator.vibrate){
    navigator.vibrate([30,30,50]);
  }
}

/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

document.addEventListener("keydown",e=>{
  if(!activeGame)return;

  if(e.key==="Escape"){
    closeGame();
  }

  if(e.key===" "){
    const btn=document.querySelector(".bigAction");
    if(btn){
      e.preventDefault();
      btn.click();
    }
  }
});
